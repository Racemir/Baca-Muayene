<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Kartı (Karanlık/Aydınlık sekmelerde yüksek kontrast) -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#253041" stroke-width="1.5"/>

  <!-- Logo İkonu (Baca ve Duman) -->
  <g transform="translate(32, 33) scale(0.38) translate(-3.5, -92)">
    <!-- Duman İkonları (Cyan / Glow Efekti) -->
    <path
      fill="url(#smokeGrad)"
      stroke="url(#smokeGrad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
      d="M -2,68 C -4,52 10,48 12,32 C 13,44 -1,48 -1,62 Z"
    />
    <path
      fill="url(#smokeGrad)"
      stroke="url(#smokeGrad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
      d="M 3,64 C 5,53 16,49 17,39 C 16,47 7,51 5,62 Z"
    />

    <!-- Baca Şapkası -->
    <rect
      x="-7.5"
      y="74"
      width="15"
      height="7"
      rx="1.5"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="1"
      stroke-linejoin="round"
    />

    <!-- Baca Gövdesi -->
    <path
      fill="rgba(255, 255, 255, 0.08)"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M -9,152 L -5.5,81 L 5.5,81 L 9,152 Z"
    />

    <!-- Baca Boğum Çizgisi -->
    <line
      x1="-7.5"
      y1="89"
      x2="7.5"
      y2="89"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </g>
</svg>